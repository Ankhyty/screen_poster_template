<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1026"/>
      <stop offset="35%" stop-color="#1f2554"/>
      <stop offset="65%" stop-color="#49326b"/>
      <stop offset="85%" stop-color="#8b4367"/>
      <stop offset="100%" stop-color="#d46b72"/>
    </linearGradient>
    <radialGradient id="meteorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="1"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="900" height="1200" fill="url(#skyGrad)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="120" cy="150" r="1.5" opacity="0.8"/>
    <circle cx="280" cy="90" r="2" opacity="0.9"/>
    <circle cx="450" cy="180" r="1.2" opacity="0.6"/>
    <circle cx="620" cy="110" r="2.5" opacity="0.95"/>
    <circle cx="780" cy="220" r="1.8" opacity="0.7"/>
    <circle cx="180" cy="320" r="1.5" opacity="0.85"/>
    <circle cx="340" cy="260" r="2" opacity="0.7"/>
    <circle cx="560" cy="310" r="1.2" opacity="0.6"/>
    <circle cx="720" cy="370" r="2.2" opacity="0.9"/>
    <circle cx="840" cy="140" r="1.5" opacity="0.8"/>
    <circle cx="80" cy="450" r="1.8" opacity="0.75"/>
    <circle cx="500" cy="80" r="1.5" opacity="0.8"/>
  </g>

  <!-- Comet / Meteor Streak -->
  <path d="M 150 100 Q 400 350 750 680" stroke="url(#meteorGlow)" stroke-width="6" fill="none" opacity="0.9" stroke-linecap="round"/>
  <path d="M 150 100 Q 400 350 750 680" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.95"/>
  <circle cx="750" cy="680" r="16" fill="url(#meteorGlow)"/>
  <circle cx="750" cy="680" r="5" fill="#ffffff"/>

  <!-- Stylized Anime Clouds -->
  <path d="M -50 780 C 100 700 250 720 380 770 C 500 810 650 740 780 780 C 880 810 950 850 950 900 L 950 1200 L -50 1200 Z" fill="url(#cloudGrad)"/>
  <path d="M -50 860 C 120 810 320 830 480 870 C 640 910 750 860 950 890 L 950 1200 L -50 1200 Z" fill="#312e81" opacity="0.4"/>

  <!-- Mountain Silhouettes -->
  <polygon points="-50,980 220,840 520,990 780,870 950,960 950,1200 -50,1200" fill="#1e1b4b"/>
  <polygon points="-50,1040 180,940 450,1060 690,950 950,1030 950,1200 -50,1200" fill="#0f172a"/>

  <!-- Hill Foreground with Silhouettes -->
  <path d="M -50 1090 Q 300 1010 600 1060 T 950 1070 L 950 1200 L -50 1200 Z" fill="#090d16"/>

  <!-- Anime Silhouette on Hill: Girl & Boy looking at comet -->
  <g fill="#020617">
    <!-- Boy -->
    <rect x="420" y="990" width="10" height="40" rx="3"/>
    <circle cx="425" cy="980" r="9"/>
    <!-- Girl with scarf -->
    <rect x="445" y="995" width="10" height="36" rx="3"/>
    <circle cx="450" cy="983" r="8"/>
    <!-- Flowing scarf -->
    <path d="M 454 990 Q 475 995 490 985 Q 475 1005 454 998 Z" fill="#d946ef" opacity="0.9"/>
  </g>

  <!-- Title Badge inside Cover -->
  <rect x="50" y="60" width="140" height="34" rx="17" fill="rgba(255, 255, 255, 0.2)" backdrop-filter="blur(10px)"/>
  <text x="120" y="82" fill="#ffffff" font-size="16" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle" letter-spacing="1">放映精选</text>

  <!-- Subtitle Text -->
  <text x="50" y="1120" fill="#ffffff" font-size="36" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="bold" letter-spacing="2">君の名は。</text>
  <text x="50" y="1155" fill="rgba(255, 255, 255, 0.75)" font-size="20" font-family="sans-serif" letter-spacing="1">YOUR NAME · 新海诚作品</text>
</svg>
